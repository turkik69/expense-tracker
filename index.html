<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Expense Tracker</title>
  </head>

  <body>
    <input id="email" placeholder="Email" />
    <button id="send-otp">Send OTP</button>

    <div id="status"></div>

    <script type="module">
      import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

      const SUPABASE_URL = "SUPABASE_URL";
      const SUPABASE_ANON_KEY = "SUPABASE_ANON_KEY";

      const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      const statusEl = document.getElementById("status");
      const emailEl = document.getElementById("email");

      document.getElementById("send-otp").addEventListener("click", async () => {
        const email = emailEl.value.trim();
        if (!email) return;

        const { error } = await supabase.auth.signInWithOtp({
          email,
          options: {
            emailRedirectTo: "https://turkik69.github.io/expense-tracker/",
          },
        });

        if (error) statusEl.textContent = "Error: " + error.message;
        else statusEl.textContent = "تم إرسال رابط/OTP على بريدك.";
      });

      async function refreshUI() {
        const { data } = await supabase.auth.getSession();
        const session = data.session;

        if (session) {
          statusEl.textContent = "✅ Logged in: " + session.user.email;
        } else {
          statusEl.textContent = "❌ Not logged in";
        }
      }

      // عند فتح الصفحة (سواء دخول عادي أو رجوع من الرابط)
      refreshUI();

      // لو تغيّر شيء أثناء الجلسة (اختياري لكنه مفيد)
      supabase.auth.onAuthStateChange(() => refreshUI());
    </script>
  </body>
</html>

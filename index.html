<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>نموذج تجريبي — تتبع المصاريف</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep:#0D1B2E; --navy-card:#16283F; --navy-card-alt:#1C3350;
    --gold:#D4AF6A; --gold-bright:#E8C888; --cream:#F2EDE1; --muted:#8592A6;
    --warn:#C1614A; --hairline: rgba(212,175,106,0.16);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ font-family:'Cairo','Segoe UI',Tahoma,sans-serif; background:var(--navy-deep); color:var(--cream); min-height:100vh; display:flex; justify-content:center; }
  .app{ width:100%; max-width:430px; min-height:100vh; display:flex; flex-direction:column; position:relative; }
  header{ padding:20px 20px 8px; }
  header .eyebrow{ font-size:12px; color:var(--muted); font-weight:600; }
  header h1{ font-size:20px; font-weight:800; margin-top:2px; }
  main{ flex:1; padding:12px 20px 110px; overflow-y:auto; }
  .screen{display:none;}
  .screen.active{display:block; animation:fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  .hero{ background:linear-gradient(155deg, var(--navy-card), var(--navy-card-alt)); border:1px solid var(--hairline); border-radius:20px; padding:22px 20px; margin-bottom:18px; }
  .hero .label{font-size:13px; color:var(--muted); font-weight:600;}
  .hero .amount{ font-size:40px; font-weight:900; color:var(--gold-bright); margin:4px 0 2px; letter-spacing:-0.5px; }
  .hero .amount span{font-size:18px; font-weight:700; color:var(--gold);}
  .hero .sub{font-size:13px; color:var(--muted); margin-bottom:14px;}
  .progress-track{height:8px; border-radius:99px; background:rgba(255,255,255,0.06); overflow:hidden;}
  .progress-fill{height:100%; border-radius:99px; background:linear-gradient(90deg, var(--gold), var(--gold-bright)); transition:width .5s ease;}

  .section-title{font-size:13px; font-weight:700; color:var(--muted); margin:22px 0 10px;}

  .cat-row, .tx-row{ display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--hairline); }
  .tx-row{cursor:pointer;}
  .cat-row:last-child, .tx-row:last-child{border-bottom:none;}
  .cat-icon{ width:36px; height:36px; border-radius:11px; background:var(--navy-card-alt); display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
  .cat-info{flex:1; min-width:0;}
  .cat-name, .tx-name{font-size:14px; font-weight:700;}
  .cat-bar-track{height:4px; border-radius:99px; background:rgba(255,255,255,0.06); margin-top:6px;}
  .cat-bar-fill{height:100%; border-radius:99px; transition:width .3s ease;}
  .cat-amount, .tx-amount{font-size:14px; font-weight:800; flex-shrink:0;}
  .cat-amount span{font-weight:600; font-size:11px;}
  .tx-meta{font-size:12px; color:var(--muted); margin-top:2px;}
  .tx-tag{ font-size:11px; font-weight:700; color:var(--gold); background:rgba(212,175,106,0.1); padding:2px 8px; border-radius:99px; display:inline-block; margin-top:3px; }

  .field-label{font-size:13px; font-weight:700; color:var(--muted); margin-bottom:8px; display:block;}
  textarea, input, select{ width:100%; background:var(--navy-card); border:1px solid var(--hairline); border-radius:14px; padding:13px 14px; color:var(--cream); font-family:'Cairo',sans-serif; font-size:14px; font-weight:500; }
  textarea{min-height:96px; resize:none; line-height:1.7;}
  textarea:focus, input:focus, select:focus{outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(212,175,106,0.15);}
  .hint{font-size:11px; color:var(--muted); margin:6px 2px 0;}

  .msg-preview{ background:var(--navy-card); border:1px solid var(--hairline); border-radius:14px; padding:14px; font-size:13px; line-height:1.9; color:var(--muted); display:none; margin-top:12px; }
  .msg-preview.show{display:block;}
  mark.hl{ display:inline-block; background:rgba(212,175,106,0.12); color:var(--gold-bright); font-weight:800; padding:1px 4px; border-radius:5px; animation:pop .5s ease; }
  @keyframes pop{ 0%{background:rgba(212,175,106,0); transform:scale(1);} 40%{background:rgba(212,175,106,0.4); transform:scale(1.05);} 100%{background:rgba(212,175,106,0.12); transform:scale(1);} }

  .btn{ width:100%; padding:14px; border:none; border-radius:14px; font-family:'Cairo',sans-serif; font-weight:800; font-size:14px; cursor:pointer; transition:transform .15s ease; }
  .btn:active{transform:scale(0.98);}
  .btn:focus-visible{outline:2px solid var(--gold-bright); outline-offset:2px;}
  .btn-gold{background:linear-gradient(120deg, var(--gold), var(--gold-bright)); color:var(--navy-deep);}
  .btn-outline{background:transparent; border:1px solid var(--hairline); color:var(--cream);}
  .btn-text-danger{ width:100%; background:none; border:none; color:var(--warn); font-family:'Cairo',sans-serif; font-weight:700; font-size:13px; padding:12px; cursor:pointer; margin-top:4px; }

  .confirm-card{ background:var(--navy-card); border:1px solid var(--gold); border-radius:16px; padding:16px; margin-top:14px; display:none; animation:slideUp .35s ease; }
  .confirm-card.show{display:block;}
  @keyframes slideUp{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);}}
  .confirm-row{margin-bottom:12px;}

  .divider{ display:flex; align-items:center; gap:10px; margin:22px 0 16px; color:var(--muted); font-size:12px; font-weight:600; }
  .divider::before, .divider::after{content:''; flex:1; height:1px; background:var(--hairline);}

  .filter-row{ display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:6px; }
  .filter-row::-webkit-scrollbar{display:none;}
  .filter-chip{ flex-shrink:0; padding:8px 14px; border-radius:99px; background:var(--navy-card); border:1px solid var(--hairline); color:var(--muted); font-family:'Cairo',sans-serif; font-size:12px; font-weight:700; cursor:pointer; white-space:nowrap; }
  .filter-chip.active{ background:var(--gold); color:var(--navy-deep); border-color:var(--gold); }

  .toast{ position:fixed; bottom:100px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--gold-bright); color:var(--navy-deep); font-weight:800; font-size:13px; padding:10px 20px; border-radius:99px; opacity:0; transition:all .3s ease; pointer-events:none; white-space:nowrap; z-index:40; }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .modal-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,0.55); opacity:0; pointer-events:none; transition:opacity .25s ease; z-index:30; }
  .modal-backdrop.show{opacity:1; pointer-events:auto;}
  .edit-sheet{ position:fixed; bottom:0; left:50%; transform:translateX(-50%) translateY(100%); width:100%; max-width:430px; background:var(--navy-card); border-top:1px solid var(--hairline); border-radius:20px 20px 0 0; padding:8px 20px calc(20px + env(safe-area-inset-bottom)); transition:transform .3s ease; z-index:31; }
  .edit-sheet.show{transform:translateX(-50%) translateY(0);}
  .sheet-handle{ width:36px; height:4px; background:var(--hairline); border-radius:99px; margin:8px auto 18px; }

  nav{ position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:430px; background:rgba(13,27,46,0.92); backdrop-filter:blur(10px); border-top:1px solid var(--hairline); display:flex; padding:10px 12px calc(10px + env(safe-area-inset-bottom)); z-index:20; }
  .nav-btn{ flex:1; background:none; border:none; color:var(--muted); font-family:'Cairo',sans-serif; font-size:11px; font-weight:700; display:flex; flex-direction:column; align-items:center; gap:4px; padding:6px 2px; cursor:pointer; }
  .nav-btn .ic{font-size:18px;}
  .nav-btn.active{color:var(--gold-bright);}
  .nav-btn:focus-visible{outline:2px solid var(--gold-bright); outline-offset:2px;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important;}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="eyebrow">نموذج تفاعلي — للتجربة فقط</div>
    <h1 id="pageTitle">الرئيسية</h1>
  </header>

  <main>
    <section class="screen active" id="home">
      <div class="hero">
        <div class="label">إجمالي هذا الشهر</div>
        <div class="amount" id="totalAmount">0.000 <span>ر.ع</span></div>
        <div class="sub" id="budgetSub"></div>
        <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      </div>
      <div class="section-title">حسب الفئة</div>
      <div id="catList"></div>
      <div class="section-title">آخر العمليات</div>
      <div id="txList"></div>
    </section>

    <section class="screen" id="add">
      <label class="field-label">الصقي نص رسالة الخصم (أو شاركيها من تطبيق الرسائل)</label>
      <textarea id="smsInput">عزيزي العميل، تم خصم مبلغ 8.750 ر.ع من حسابك لدى مطعم بيت الشاي بتاريخ 09/08/2026 الساعة 13:45. الرصيد المتاح: 245.300 ر.ع</textarea>
      <div class="hint">مثال توضيحي — الصقي رسالتك الفعلية لتجربة حقيقية</div>
      <div class="msg-preview" id="msgPreview"></div>
      <div style="height:12px"></div>
      <button class="btn btn-gold" id="extractBtn">✨ استخراج البيانات</button>

      <div class="confirm-card" id="confirmCard">
        <div class="confirm-row"><label class="field-label">المبلغ</label><input type="text" id="cAmount" inputmode="decimal"></div>
        <div class="confirm-row"><label class="field-label">الجهة</label><input type="text" id="cMerchant"></div>
        <div class="confirm-row"><label class="field-label">التصنيف</label><select id="cCategory"></select></div>
        <button class="btn btn-gold" id="confirmBtn">تأكيد الإضافة</button>
      </div>

      <div class="divider">أو إدخال يدوي</div>
      <div class="confirm-row"><label class="field-label">المبلغ</label><input type="text" id="mAmount" inputmode="decimal" placeholder="0.000"></div>
      <div class="confirm-row"><label class="field-label">الجهة</label><input type="text" id="mMerchant" placeholder="مثال: كارفور"></div>
      <div class="confirm-row"><label class="field-label">التصنيف</label><select id="mCategory"></select></div>
      <button class="btn btn-outline" id="manualBtn">إضافة يدوياً</button>

      <div style="height:14px"></div>
      <button class="btn btn-outline" disabled style="opacity:.5">📷 تصوير فاتورة — قريباً بالنسخة الكاملة</button>
    </section>

    <section class="screen" id="history">
      <div class="filter-row" id="filterRow"></div>
      <div id="historyList"></div>
    </section>

    <section class="screen" id="settings">
      <div class="section-title">ميزانية كل فئة (شهرياً، ر.ع)</div>
      <div id="budgetInputs"></div>
      <button class="btn btn-gold" id="saveBudgetsBtn" style="margin-top:6px">حفظ الميزانيات</button>
      <div class="divider">البيانات</div>
      <button class="btn btn-outline" id="exportBtn">⬇️ تصدير كل المصاريف (CSV)</button>
    </section>
  </main>

  <div class="toast" id="toast">تمّ ✓</div>
  <div class="modal-backdrop" id="modalBackdrop"></div>
  <div class="edit-sheet" id="editSheet">
    <div class="sheet-handle"></div>
    <div class="confirm-row"><label class="field-label">المبلغ</label><input type="text" id="eAmount" inputmode="decimal"></div>
    <div class="confirm-row"><label class="field-label">الجهة</label><input type="text" id="eMerchant"></div>
    <div class="confirm-row"><label class="field-label">التصنيف</label><select id="eCategory"></select></div>
    <button class="btn btn-gold" id="saveEditBtn">حفظ التعديل</button>
    <button class="btn-text-danger" id="deleteBtn">حذف المصروف</button>
  </div>

  <nav>
    <button class="nav-btn active" data-screen="home"><span class="ic">🏠</span>الرئيسية</button>
    <button class="nav-btn" data-screen="add"><span class="ic">➕</span>إضافة</button>
    <button class="nav-btn" data-screen="history"><span class="ic">📋</span>السجل</button>
    <button class="nav-btn" data-screen="settings"><span class="ic">⚙️</span>الإعدادات</button>
  </nav>
</div>

<script>
const CATS = {
  'مطاعم ومقاهي': {icon:'🍽️', keywords:['مطعم','كافيه','قهوة','بيت الشاي','ستاربكس','كوستا']},
  'بقالة': {icon:'🛒', keywords:['كارفور','لولو','سلطان سنتر','سوبرماركت','بقالة']},
  'مواصلات': {icon:'🚗', keywords:['بنزين','تاكسي','أوبر','كريم','محطة']},
  'فواتير': {icon:'🧾', keywords:['اتصالات','عمانتل','أوريدو','كهرباء','مياه']},
  'تسوق': {icon:'🛍️', keywords:['سنتر','مول','ازياء','ملابس']},
  'أخرى': {icon:'💳', keywords:[]}
};

let categoryBudgets = {
  'مطاعم ومقاهي': 40, 'بقالة': 80, 'مواصلات': 50,
  'فواتير': 40, 'تسوق': 60, 'أخرى': 30
};

function daysAgo(n){ const d = new Date(); d.setDate(d.getDate()-n); d.setHours(12,0,0,0); return d; }

let nextId = 7;
let expenses = [
  {id:1, amount:24.500, merchant:'لولو هايبرماركت', category:'بقالة', date:daysAgo(1)},
  {id:2, amount:3.200, merchant:'كوستا كوفي', category:'مطاعم ومقاهي', date:daysAgo(2)},
  {id:3, amount:15.000, merchant:'محطة بترول', category:'مواصلات', date:daysAgo(3)},
  {id:4, amount:45.000, merchant:'مركز مسقط سيتي', category:'تسوق', date:daysAgo(4)},
  {id:5, amount:18.900, merchant:'عمانتل', category:'فواتير', date:daysAgo(7)},
  {id:6, amount:12.750, merchant:'مطعم بيت الشاي', category:'مطاعم ومقاهي', date:daysAgo(7)}
];

let activeFilter = 'الكل';
let editingId = null;

function guessCategory(text){
  text = text || '';
  for(const [cat, data] of Object.entries(CATS)){
    if(data.keywords.some(k => text.includes(k))) return cat;
  }
  return 'أخرى';
}

function formatRelative(date){
  const diffDays = Math.floor((new Date() - date) / 86400000);
  if(diffDays <= 0) return 'اليوم';
  if(diffDays === 1) return 'أمس';
  if(diffDays < 7) return `قبل ${diffDays} أيام`;
  return `${date.getDate()}/${date.getMonth()+1}/${date.getFullYear()}`;
}

function populateSelects(){
  document.querySelectorAll('#cCategory, #mCategory, #eCategory').forEach(sel=>{
    sel.innerHTML = Object.keys(CATS).map(c=>`<option value="${c}">${CATS[c].icon} ${c}</option>`).join('');
  });
}

function renderTxList(containerId, list){
  const container = document.getElementById(containerId);
  if(!list.length){
    container.innerHTML = `<div style="color:var(--muted); font-size:13px; padding:10px 0;">ما فيه عمليات</div>`;
    return;
  }
  container.innerHTML = list.map(e => `
    <div class="tx-row" data-id="${e.id}">
      <div class="cat-icon">${CATS[e.category]?.icon || '💳'}</div>
      <div class="cat-info">
        <div class="tx-name">${e.merchant}</div>
        <div class="tx-meta">${formatRelative(e.date)} <span class="tx-tag">${e.category}</span></div>
      </div>
      <div class="tx-amount" style="color:var(--gold-bright)">${e.amount.toFixed(3)}</div>
    </div>`).join('');
  container.querySelectorAll('.tx-row').forEach(row=>{
    row.addEventListener('click', ()=> openEdit(parseInt(row.dataset.id)));
  });
}

function renderHome(){
  const total = expenses.reduce((s,e)=>s+e.amount,0);
  const totalBudget = Object.values(categoryBudgets).reduce((a,b)=>a+b,0) || 1;
  document.getElementById('totalAmount').innerHTML = total.toFixed(3) + ' <span>ر.ع</span>';
  const pct = Math.min(100, (total/totalBudget)*100);
  const fill = document.getElementById('progressFill');
  fill.style.width = pct + '%';
  fill.style.background = pct>=90 ? 'var(--warn)' : 'linear-gradient(90deg, var(--gold), var(--gold-bright))';
  document.getElementById('budgetSub').textContent = `من إجمالي ميزانية ${totalBudget.toFixed(3)} ر.ع — متبقّي ${Math.max(0,totalBudget-total).toFixed(3)} ر.ع`;

  const byCat = {};
  expenses.forEach(e=>{ byCat[e.category] = (byCat[e.category]||0) + e.amount; });
  const entries = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  document.getElementById('catList').innerHTML = entries.length ? entries.map(([cat, amt])=>{
    const budget = categoryBudgets[cat] || 1;
    const ratio = amt / budget;
    const warn = ratio >= 0.8;
    const color = warn ? 'var(--warn)' : 'var(--gold)';
    return `
    <div class="cat-row">
      <div class="cat-icon">${CATS[cat]?.icon || '💳'}</div>
      <div class="cat-info">
        <div class="cat-name">${cat}${ratio>=1 ? ' ⚠️' : ''}</div>
        <div class="cat-bar-track"><div class="cat-bar-fill" style="width:${Math.min(100,ratio*100)}%; background:${color}"></div></div>
      </div>
      <div class="cat-amount" style="color:${warn?'var(--warn)':'var(--gold-bright)'}">${amt.toFixed(3)} <span>/${budget.toFixed(0)}</span></div>
    </div>`;
  }).join('') : `<div style="color:var(--muted); font-size:13px; padding:10px 0;">ما فيه مصاريف بعد</div>`;

  renderTxList('txList', [...expenses].sort((a,b)=>b.date-a.date).slice(0,6));
}

function renderHistory(){
  const filterRow = document.getElementById('filterRow');
  const cats = ['الكل', ...Object.keys(CATS)];
  filterRow.innerHTML = cats.map(c => `<div class="filter-chip ${c===activeFilter?'active':''}" data-cat="${c}">${c==='الكل'?'الكل':CATS[c].icon+' '+c}</div>`).join('');
  filterRow.querySelectorAll('.filter-chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{ activeFilter = chip.dataset.cat; renderHistory(); });
  });
  const filtered = activeFilter==='الكل' ? expenses : expenses.filter(e=>e.category===activeFilter);
  renderTxList('historyList', [...filtered].sort((a,b)=>b.date-a.date));
}

function renderBudgetInputs(){
  document.getElementById('budgetInputs').innerHTML = Object.keys(CATS).map(cat => `
    <div class="confirm-row">
      <label class="field-label">${CATS[cat].icon} ${cat}</label>
      <input type="text" inputmode="decimal" class="budget-input" data-cat="${cat}" value="${categoryBudgets[cat].toFixed(3)}">
    </div>`).join('');
}

function renderAll(){ renderHome(); renderHistory(); renderBudgetInputs(); }

function extractFromText(text){
  const amountMatch = text.match(/(\d+\.\d{2,3})\s*ر\.?\s?ع/);
  const merchantMatch = text.match(/لدى\s+([\u0621-\u064A\s]+?)\s+بتاريخ/);
  return {
    amount: amountMatch ? amountMatch[1] : '',
    merchant: merchantMatch ? merchantMatch[1].trim() : '',
    amountRaw: amountMatch ? amountMatch[0] : null,
    merchantRaw: merchantMatch ? merchantMatch[1].trim() : null
  };
}

function highlightPreview(text, amountRaw, merchantRaw){
  let html = text;
  if(merchantRaw) html = html.replace(merchantRaw, `<mark class="hl">${merchantRaw}</mark>`);
  if(amountRaw) html = html.replace(amountRaw, `<mark class="hl">${amountRaw}</mark>`);
  return html;
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1600);
}

function switchScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active', s.id===name));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active', b.dataset.screen===name));
  const titles = {home:'الرئيسية', add:'إضافة مصروف', history:'السجل', settings:'الإعدادات'};
  document.getElementById('pageTitle').textContent = titles[name];
}

function openEdit(id){
  const e = expenses.find(x=>x.id===id);
  if(!e) return;
  editingId = id;
  document.getElementById('eAmount').value = e.amount.toFixed(3);
  document.getElementById('eMerchant').value = e.merchant;
  document.getElementById('eCategory').value = e.category;
  document.getElementById('modalBackdrop').classList.add('show');
  document.getElementById('editSheet').classList.add('show');
}

function closeEdit(){
  editingId = null;
  document.getElementById('modalBackdrop').classList.remove('show');
  document.getElementById('editSheet').classList.remove('show');
}

function pad(n){ return n.toString().padStart(2,'0'); }

function exportCSV(){
  let csv = 'التاريخ,الجهة,الفئة,المبلغ\n';
  [...expenses].sort((a,b)=>b.date-a.date).forEach(e=>{
    const d = `${e.date.getFullYear()}-${pad(e.date.getMonth()+1)}-${pad(e.date.getDate())}`;
    csv += `${d},${e.merchant},${e.category},${e.amount.toFixed(3)}\n`;
  });
  const blob = new Blob(['\uFEFF' + csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'مصاريفي.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

document.querySelectorAll('.nav-btn').forEach(b=>{
  b.addEventListener('click', ()=>switchScreen(b.dataset.screen));
});

document.getElementById('extractBtn').addEventListener('click', ()=>{
  const text = document.getElementById('smsInput').value.trim();
  if(!text) return;
  const {amount, merchant, amountRaw, merchantRaw} = extractFromText(text);
  const preview = document.getElementById('msgPreview');
  preview.innerHTML = highlightPreview(text, amountRaw, merchantRaw);
  preview.classList.add('show');
  setTimeout(()=>{
    document.getElementById('cAmount').value = amount;
    document.getElementById('cMerchant').value = merchant;
    document.getElementById('cCategory').value = guessCategory(merchant);
    document.getElementById('confirmCard').classList.add('show');
  }, 450);
});

document.getElementById('confirmBtn').addEventListener('click', ()=>{
  const amount = parseFloat(document.getElementById('cAmount').value);
  if(!amount || amount<=0){ document.getElementById('cAmount').focus(); return; }
  const merchant = document.getElementById('cMerchant').value.trim() || 'غير معروف';
  const category = document.getElementById('cCategory').value;
  expenses.push({id: nextId++, amount, merchant, category, date: new Date()});
  renderAll();
  showToast('أُضيفت ✓');
  document.getElementById('confirmCard').classList.remove('show');
  document.getElementById('msgPreview').classList.remove('show');
  document.getElementById('smsInput').value='';
  switchScreen('home');
});

document.getElementById('manualBtn').addEventListener('click', ()=>{
  const amount = parseFloat(document.getElementById('mAmount').value);
  if(!amount || amount<=0){ document.getElementById('mAmount').focus(); return; }
  const merchant = document.getElementById('mMerchant').value.trim() || 'غير معروف';
  const category = document.getElementById('mCategory').value;
  expenses.push({id: nextId++, amount, merchant, category, date: new Date()});
  renderAll();
  showToast('أُضيفت ✓');
  document.getElementById('mAmount').value='';
  document.getElementById('mMerchant').value='';
  switchScreen('home');
});

document.getElementById('modalBackdrop').addEventListener('click', closeEdit);

document.getElementById('saveEditBtn').addEventListener('click', ()=>{
  const amount = parseFloat(document.getElementById('eAmount').value);
  if(!amount || amount<=0) return;
  const e = expenses.find(x=>x.id===editingId);
  if(!e) return;
  e.amount = amount;
  e.merchant = document.getElementById('eMerchant').value.trim() || 'غير معروف';
  e.category = document.getElementById('eCategory').value;
  closeEdit();
  renderAll();
  showToast('تم التعديل ✓');
});

document.getElementById('deleteBtn').addEventListener('click', ()=>{
  expenses = expenses.filter(x=>x.id!==editingId);
  closeEdit();
  renderAll();
  showToast('حُذف ✓');
});

document.getElementById('saveBudgetsBtn').addEventListener('click', ()=>{
  document.querySelectorAll('.budget-input').forEach(inp=>{
    const val = parseFloat(inp.value);
    if(!isNaN(val) && val>=0) categoryBudgets[inp.dataset.cat] = val;
  });
  renderAll();
  showToast('تم حفظ الميزانيات ✓');
});

document.getElementById('exportBtn').addEventListener('click', exportCSV);

populateSelects();
renderAll();
</script>
</body>
</html>

function fmt(n){ return Number(n||0).toLocaleString("ar-OM",{minimumFractionDigits:3,maximumFractionDigits:3}); }

function usernameToEmail(username){
  const clean = username.trim().toLowerCase();
  const asciiPart = clean.replace(/[^a-z0-9]/g,"").slice(0,20);
  let hash = 0;
  for(let i=0;i<clean.length;i++){ hash = ((hash<<5)-hash+clean.charCodeAt(i))|0; }
  const local = (asciiPart || "user") + "_" + Math.abs(hash).toString(36);
  return `${local}@masroofy.local`;
}
function monthKey(d){ return d.slice(0,7); }

// استخراج بيانات المصروف من نص رسالة خصم بنكية
function extractAmount(text){
  let m = text.match(/OMR\s*(\d+\.\d{2,3})/i);
  if(m) return m;
  m = text.match(/(\d+\.\d{2,3})-?\s*ر\.?\s?ع\.?/);
  if(m) return m;
  return null;
}
function extractMerchant(text){
  let m = text.match(/(?:لدى|في)\s+([A-Za-z0-9\u0621-\u064A][A-Za-z0-9\u0621-\u064A\s\-]*?)(?=\.|\s*(?:بتاريخ|رصيد))/);
  return m ? m[1].trim() : null;
}
function extractFromMessage(text){
  const amountMatch = extractAmount(text);
  const merchant = extractMerchant(text);
  return {
    amount: amountMatch ? amountMatch[1] : "",
    merchant: merchant || "",
    amountRaw: amountMatch ? amountMatch[0] : null,
    merchantRaw: merchant,
  };
}

  "ترفيه": ["سينما","ترفيه","CINEMA"],
  "صحة": ["صيدلية","مستشفى","عيادة","PHARMACY","HOSPITAL","CLINIC"],
  "تسوق": ["سنتر","مول","ازياء","ملابس","MALL","FASHION"],
  "فواتير": ["اتصالات","عمانتل","أوريدو","كهرباء","مياه","OMANTEL","OOREDOO"],
};
function guessCategoryFromText(text, categories){
  if(!text) return null;
  const lower = text.toLowerCase();
  for(const [catName, keywords] of Object.entries(MERCHANT_HINTS)){
    if(keywords.some(k=>lower.includes(k.toLowerCase())) && categories.some(c=>c.name===catName)) return catName;
  }
  return null;
}
function escapeHtml(str){ return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function highlightMessage(text, amountRaw, merchantRaw, markStyle){
  let escaped = escapeHtml(text);
  const wrap = s => `<mark style="${markStyle}">${s}</mark>`;
  if(merchantRaw){ const e=escapeHtml(merchantRaw); escaped = escaped.replace(e, wrap(e)); }
  if(amountRaw){ const e=escapeHtml(amountRaw); escaped = escaped.replace(e, wrap(e)); }
  return escaped;
}

  let cumulative=0;
  const arcs=categoryTotals.map((c,i)=>{ const pct=(c.total/total)*100; const arc={...c,pct,offset:cumulative,color:palette[i%palette.length]}; cumulative+=pct; return arc; });
  const circumference=2*Math.PI*15.5;
  return (
    <Screen>
      <TopBar title="التقارير" />
      <Card style={{marginBottom:16}}>
        <p style={{fontSize:18,fontWeight:700,margin:"0 0 12px"}}>توزيع المصاريف هذا الشهر</p>
        {categoryTotals.length===0 ? <p style={{fontSize:18,color:COLORS.textMuted,textAlign:"center",padding:"20px 0"}}>لا توجد مصاريف مسجلة هذا الشهر بعد.</p> : (
          <>
            <div style={{display:"flex",justifyContent:"center",padding:"8px 0 16px"}}>
              <svg width="140" height="140" viewBox="0 0 36 36">
                <circle cx="18" cy="18" r="15.5" fill="none" stroke={COLORS.border} strokeWidth="4" />
                {arcs.map(a=>(
                  <circle key={a.name} cx="18" cy="18" r="15.5" fill="none" stroke={a.color} strokeWidth="4"
                    strokeDasharray={`${(a.pct/100)*circumference} ${circumference}`}
                    strokeDashoffset={-(a.offset/100)*circumference} strokeLinecap="round" transform="rotate(-90 18 18)" />
                ))}
              </svg>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {arcs.map(a=>(
                <div key={a.name} style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                  <div style={{display:"flex",alignItems:"center",gap:8}}><span style={{width:8,height:8,borderRadius:4,background:a.color,display:"inline-block"}} /><span style={{fontSize:17}}>{a.name}</span></div>
                  <span style={{fontSize:17,color:COLORS.textSecondary,display:"inline-flex",alignItems:"center",gap:3}}>{fmt(a.total)}<Riyal size={11}/> · {Math.round(a.pct)}%</span>
                </div>
              ))}
            </div>
          </>
        )}
      </Card>
    </Screen>
  );
}

function BudgetScreen({categories,categoryTotals,onSaveCategory,onDeleteCategory,onAddCategory,onReorderCategories,monthlyBudget,onSaveMonthlyBudget}){
  const [editing,setEditing]=useState(null); const [newCatName,setNewCatName]=useState(""); const [newCatLimit,setNewCatLimit]=useState(""); const [newCatIcon,setNewCatIcon]=useState("📦");
  const byId=useMemo(()=>Object.fromEntries(categories.map(c=>[c.id,c])),[categories]);
  const sortedIds=useMemo(()=>[...categories].sort((a,b)=>(a.sort_order??0)-(b.sort_order??0)).map(c=>c.id),[categories]);
  const [order,setOrder]=useState(sortedIds);
  useEffect(()=>{ setOrder(sortedIds); },[categories.length]);
  const displayOrder=order.filter(id=>byId[id]);
  const [dragId,setDragId]=useState(null);
  const [dragDeltaY,setDragDeltaY]=useState(0);
  const rowRefs=useRef({});
  const pressTimer=useRef(null);
  const dragStartY=useRef(0);

  const beginPress=(id,clientY)=>{
    pressTimer.current=setTimeout(()=>{
      setDragId(id); dragStartY.current=clientY; setDragDeltaY(0);
      if(navigator.vibrate) navigator.vibrate(12);
    },450);
  };
  const cancelPress=()=>{ if(pressTimer.current) clearTimeout(pressTimer.current); };
  const onDragMove=clientY=>{
    if(!dragId) return;
    const delta=clientY-dragStartY.current;
    const idx=displayOrder.indexOf(dragId);
    const el=rowRefs.current[dragId];
    const rowHeight=(el?.getBoundingClientRect().height||70)+12;
    if(delta>rowHeight/2 && idx<displayOrder.length-1){
      const next=[...displayOrder]; [next[idx],next[idx+1]]=[next[idx+1],next[idx]];
      setOrder(next); dragStartY.current=clientY; setDragDeltaY(0); return;
    }
    if(delta<-rowHeight/2 && idx>0){
      const next=[...displayOrder]; [next[idx],next[idx-1]]=[next[idx-1],next[idx]];
      setOrder(next); dragStartY.current=clientY; setDragDeltaY(0); return;
    }
    setDragDeltaY(delta);
  };
  const endDrag=()=>{ if(dragId) onReorderCategories(displayOrder); setDragId(null); setDragDeltaY(0); };

  const totalLimit=categories.reduce((s,c)=>s+Number(c.limit_amount||0),0);
  const totalSpent=categoryTotals.reduce((s,c)=>s+c.total,0);
  const getSpent=name=>categoryTotals.find(c=>c.name===name)?.total||0;
  return (
    <Screen>
      <TopBar title="الميزانية الشهرية" />
      <Card style={{marginBottom:16}}>
        <p style={{fontSize:17,color:COLORS.textMuted,margin:"0 0 6px"}}>الدخل الشهري المخصص للمصاريف</p>
        <input type="number" defaultValue={monthlyBudget||""} placeholder="0.000" onBlur={e=>onSaveMonthlyBudget(parseFloat(e.target.value)||0)} style={{...inputStyle,fontSize:20,fontWeight:700,textAlign:"center"}} />
        <p style={{fontSize:13,color:COLORS.textMuted,margin:"6px 0 0"}}>الرصيد المتبقي بالرئيسية يُحسب من هذا الرقم</p>
      </Card>
      <Card style={{marginBottom:16}}>
        <p style={{fontSize:17,color:COLORS.textMuted,margin:0}}>إجمالي حدود الفئات</p>
        <p style={{fontSize:29,fontWeight:700,margin:"4px 0 8px",color:COLORS.navy,display:"flex",alignItems:"center",gap:5}}>{fmt(totalLimit)}<Riyal size={18}/></p>
        <div style={{height:8,background:COLORS.border,borderRadius:4,overflow:"hidden"}}><div style={{width:`${Math.min(100,(totalSpent/(totalLimit||1))*100)}%`,height:"100%",background:totalSpent>totalLimit?COLORS.danger:COLORS.gold}} /></div>
        <p style={{fontSize:16,color:COLORS.textSecondary,margin:"6px 0 0"}}>تم صرف {fmt(totalSpent)} من {fmt(totalLimit)}</p>
      </Card>
      <p style={{fontSize:13,color:COLORS.textMuted,margin:"0 0 10px"}}>اضغطي مطولاً على أيقونة أي فئة لسحبها وترتيبها</p>
      <div style={{display:"flex",flexDirection:"column",gap:12,marginBottom:16}}>
        {displayOrder.map(id=>{
          const c=byId[id]; if(!c) return null;
          const spent=getSpent(c.name); const pct=Math.min(100,(spent/(c.limit_amount||1))*100); const over=spent>c.limit_amount; const isEditing=editing===c.id;
          const isDragging=dragId===c.id;
          return (
            <div key={c.id} ref={el=>rowRefs.current[c.id]=el} style={{background:COLORS.card,border:`1px solid ${COLORS.border}`,borderRadius:22,padding:20,boxShadow:isDragging?"0 10px 26px rgba(14,61,44,0.24)":`0 3px 12px ${COLORS.shadow}`,transform:isDragging?`translateY(${dragDeltaY}px) scale(1.03)`:"none",position:"relative",zIndex:isDragging?10:1,transition:isDragging?"none":"transform .2s ease, box-shadow .2s ease"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                <div style={{display:"flex",alignItems:"center",gap:10}}>
                  <div
                    onTouchStart={e=>beginPress(c.id,e.touches[0].clientY)}
                    onTouchMove={e=>onDragMove(e.touches[0].clientY)}
                    onTouchEnd={()=>{cancelPress();endDrag();}}
                    onTouchCancel={()=>{cancelPress();endDrag();}}
                    style={{width:36,height:36,borderRadius:12,background:COLORS.chipBg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,flexShrink:0,touchAction:"none",cursor:"grab"}}>
                    {iconFor(c)}
                  </div>
                  <span style={{fontSize:18,fontWeight:600}}>{c.name}</span>
                </div>
                <button onClick={()=>setEditing(isEditing?null:c.id)} style={{background:"none",border:"none",fontSize:17,color:COLORS.textMuted,cursor:"pointer",fontFamily:"inherit"}}>{isEditing?"إغلاق":"تعديل"}</button>
              </div>
              <div style={{height:6,background:COLORS.border,borderRadius:3,overflow:"hidden"}}><div style={{width:`${pct}%`,height:"100%",background:over?COLORS.danger:COLORS.success}} /></div>
              <p style={{fontSize:16,color:over?COLORS.danger:COLORS.textSecondary,margin:"6px 0 0",display:"flex",alignItems:"center",gap:3,flexWrap:"wrap"}}>{fmt(spent)} / {fmt(c.limit_amount)}<Riyal size={10}/> {over?"— تجاوزت الميزانية":""}</p>
              {isEditing && (
                <div style={{marginTop:12,paddingTop:12,borderTop:`1px solid ${COLORS.border}`}}>
                  <p style={{fontSize:15,color:COLORS.textSecondary,margin:"0 0 8px",fontWeight:600}}>أيقونة الفئة</p>
                  <IconPicker value={iconFor(c)} onChange={ic=>onSaveCategory(c.id,{icon:ic})} />
                  <input type="number" defaultValue={c.limit_amount} onBlur={e=>onSaveCategory(c.id,{limit_amount:parseFloat(e.target.value)||0})} style={{...inputStyle,marginBottom:8}} />
                  <button onClick={()=>{onDeleteCategory(c.id); setEditing(null);}} style={{...inputStyle,background:"#FBEAE7",color:COLORS.danger,border:"none",cursor:"pointer",textAlign:"center",fontWeight:700}}>حذف الفئة</button>
                </div>
              )}
            </div>
          );
        })}
      </div>
      <Card>
        <p style={{fontSize:18,fontWeight:700,margin:"0 0 10px"}}>إضافة فئة جديدة</p>
        <input type="text" placeholder="اسم الفئة" value={newCatName} onChange={e=>setNewCatName(e.target.value)} style={{...inputStyle,marginBottom:8}} />
        <p style={{fontSize:15,color:COLORS.textSecondary,margin:"0 0 8px",fontWeight:600}}>اختاري أيقونة</p>
        <IconPicker value={newCatIcon} onChange={setNewCatIcon} />
        <p style={{fontSize:17,color:COLORS.textSecondary,margin:"0 0 6px",display:"flex",alignItems:"center",gap:4}}>سقف الميزانية <Riyal size={11}/></p>
        <input type="number" placeholder="0.000" value={newCatLimit} onChange={e=>setNewCatLimit(e.target.value)} style={{...inputStyle,marginBottom:8}} />
        <button onClick={()=>{ if(!newCatName.trim()) return; onAddCategory({name:newCatName.trim(),limit_amount:parseFloat(newCatLimit)||0,icon:newCatIcon}); setNewCatName(""); setNewCatLimit(""); setNewCatIcon("📦"); }} style={primaryBtnStyle}>إضافة الفئة</button>
      </Card>
    </Screen>
  );
}

function SettingsScreen({transactions,categories,username,onSignOut}){
  const exportData=()=>{
    const blob=new Blob([JSON.stringify({transactions,categories},null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob); const a=document.createElement("a");
    a.href=url; a.download="بياناتي-المالية.json"; a.click(); URL.revokeObjectURL(url);
  };
  return (
    <Screen>
      <TopBar title="الإعدادات" />
      <Card style={{marginBottom:16}}>
        <div style={{display:"flex",alignItems:"center",gap:10,paddingBottom:12,borderBottom:`1px solid ${COLORS.border}`,marginBottom:12}}>
          <div style={{width:42,height:42,borderRadius:"50%",background:COLORS.navy,color:COLORS.goldLight,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:19}}>{username?username[0].toUpperCase():"?"}</div>
          <div><p style={{fontSize:19,fontWeight:700,margin:0}}>{username||"مستخدم"}</p><p style={{fontSize:16,color:COLORS.textMuted,margin:0}}>حساب شخصي · Supabase</p></div>
        </div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 0"}}><span style={{fontSize:18,color:COLORS.textSecondary}}>العملة</span><span style={{fontSize:17,color:COLORS.textMuted,display:"inline-flex",alignItems:"center",gap:4}}><Riyal size={12}/> ريال عماني</span></div>
        <div style={{display:"flex",justifyContent:"space-between",padding:"10px 0"}}><span style={{fontSize:18,color:COLORS.textSecondary}}>عدد الفئات</span><span style={{fontSize:17,color:COLORS.textMuted}}>{categories.length} فئة</span></div>
        <div style={{display:"flex",justifyContent:"space-between",padding:"10px 0"}}><span style={{fontSize:18,color:COLORS.textSecondary}}>عدد العمليات</span><span style={{fontSize:17,color:COLORS.textMuted}}>{transactions.length}</span></div>
      </Card>
      <button onClick={exportData} style={{...primaryBtnStyle,background:COLORS.card,color:COLORS.navy,border:`1px solid ${COLORS.border}`,marginBottom:10}}>تصدير بياناتي (JSON)</button>
      <button onClick={onSignOut} style={{...primaryBtnStyle,background:"#FBEAE7",color:COLORS.danger,border:"none"}}>تسجيل الخروج</button>
    </Screen>
  );
}

function App(){
  const [session,setSession]=useState(null);
  const [checkingSession,setCheckingSession]=useState(true);
  const [screen,setScreen]=useState("home");
  const [transactions,setTransactions]=useState([]);
  const [categories,setCategories]=useState([]);
  const [presets,setPresets]=useState([]);
  const [pendingPreset,setPendingPreset]=useState(null);
  const [monthlyBudget,setMonthlyBudget]=useState(0);
  const [dataLoaded,setDataLoaded]=useState(false);
  const [configError,setConfigError]=useState(false);

  useEffect(()=>{
    if(!isConfigured){
      setConfigError(true); setCheckingSession(false); return;
    }
    supabase.auth.getSession().then(({data})=>{ setSession(data.session); setCheckingSession(false); });
    const {data:listener}=supabase.auth.onAuthStateChange((_e,newSession)=>setSession(newSession));
    return ()=>listener.subscription.unsubscribe();
  },[]);

  const userId=session?.user?.id;

  useEffect(()=>{
    if(!userId) return;
    (async()=>{
      const {data:cats}=await supabase.from("categories").select("*").order("created_at");
      if(cats && cats.length>0){ setCategories(cats); }
      else {
        const seeded=DEFAULT_CATEGORIES.map((c,idx)=>({...c,sort_order:idx,user_id:userId}));
        const {data:inserted}=await supabase.from("categories").insert(seeded).select();
        setCategories(inserted||[]);
      }
      const {data:pre}=await supabase.from("presets").select("*").order("created_at");
      if(pre && pre.length>0){ setPresets(pre); }
      else {
        const seededPre=DEFAULT_PRESETS.map(p=>({...p,user_id:userId}));
        const {data:insertedPre}=await supabase.from("presets").insert(seededPre).select();
        setPresets(insertedPre||[]);
      }
      const {data:settingsRow}=await supabase.from("settings").select("*").eq("user_id",userId).maybeSingle();
      setMonthlyBudget(settingsRow?.monthly_budget || 0);
      const {data:txs}=await supabase.from("transactions").select("*").order("date",{ascending:false});
      setTransactions(txs||[]); setDataLoaded(true);
    })();
  },[userId]);

  const addTransaction=useCallback(async t=>{
    const {data,error}=await supabase.from("transactions").insert({...t,user_id:userId}).select();
    if(!error && data) setTransactions(prev=>[data[0],...prev]);
  },[userId]);
  const updateTransaction=useCallback(async(id,patch)=>{
    await supabase.from("transactions").update(patch).eq("id",id);
    setTransactions(prev=>prev.map(t=>t.id===id?{...t,...patch}:t));
  },[]);
  const deleteTransaction=useCallback(async id=>{
    await supabase.from("transactions").delete().eq("id",id);
    setTransactions(prev=>prev.filter(t=>t.id!==id));
  },[]);
  const saveMonthlyBudget=useCallback(async value=>{
    await supabase.from("settings").upsert({user_id:userId,monthly_budget:value},{onConflict:"user_id"});
    setMonthlyBudget(value);
  },[userId]);
  const saveCategory=useCallback(async(id,patch)=>{
    await supabase.from("categories").update(patch).eq("id",id);
    setCategories(prev=>prev.map(c=>c.id===id?{...c,...patch}:c));
  },[]);
  const deleteCategory=useCallback(async id=>{
    await supabase.from("categories").delete().eq("id",id);
    setCategories(prev=>prev.filter(c=>c.id!==id));
  },[]);
  const addCategory=useCallback(async c=>{
    const maxOrder=categories.reduce((m,cat)=>Math.max(m,cat.sort_order??0),-1);
    const {data}=await supabase.from("categories").insert({...c,sort_order:maxOrder+1,user_id:userId}).select();
    if(data) setCategories(prev=>[...prev,data[0]]);
  },[userId,categories]);
  const reorderCategories=useCallback(async orderedIds=>{
    const updates=orderedIds.map((id,idx)=>({id,sort_order:idx}));
    setCategories(prev=>prev.map(c=>{ const u=updates.find(x=>x.id===c.id); return u?{...c,sort_order:u.sort_order}:c; }));
    await Promise.all(updates.map(u=>supabase.from("categories").update({sort_order:u.sort_order}).eq("id",u.id)));
  },[]);
  const addPreset=useCallback(async p=>{
    const {data}=await supabase.from("presets").insert({...p,user_id:userId}).select();
    if(data) setPresets(prev=>[...prev,data[0]]);
  },[userId]);
  const deletePreset=useCallback(async id=>{
    await supabase.from("presets").delete().eq("id",id);
    setPresets(prev=>prev.filter(p=>p.id!==id));
  },[]);
  const signOut=useCallback(async()=>{
    await supabase.auth.signOut(); setTransactions([]); setCategories([]); setDataLoaded(false); setScreen("home");
  },[]);

  const thisMonth=monthKey(todayStr());
  const monthTotals=useMemo(()=>transactions.filter(t=>monthKey(t.date)===thisMonth).reduce((acc,t)=>{ if(t.type==="income") acc.income+=Number(t.amount); else acc.expense+=Number(t.amount); return acc; },{income:0,expense:0}),[transactions,thisMonth]);
  const categoryTotals=useMemo(()=>{
    const map={};
    transactions.filter(t=>t.type==="expense" && monthKey(t.date)===thisMonth).forEach(t=>{ map[t.category]=(map[t.category]||0)+Number(t.amount); });
    return Object.entries(map).map(([name,total])=>({name,total,icon:iconFor(categories.find(c=>c.name===name))})).sort((a,b)=>b.total-a.total);
  },[transactions,thisMonth,categories]);

  if(configError){
    return (
      <div dir="rtl" style={{maxWidth:420,margin:"60px auto",padding:24,fontFamily:"sans-serif",background:"#FBEAE7",borderRadius:12,color:COLORS.danger}}>
        <b>لم يتم إعداد الاتصال بعد.</b><br/>افتح ملف HTML بمحرر نصوص وعبّي SUPABASE_URL و SUPABASE_ANON_KEY في أعلى الملف.
      </div>
    );
  }
  if(checkingSession) return <div style={{textAlign:"center",padding:60,color:COLORS.textMuted}}>جارِ التحقق من الجلسة...</div>;
  if(!session) return <AuthScreen />;
  if(!dataLoaded) return <div style={{textAlign:"center",padding:60,color:COLORS.textMuted}}>جارِ تحميل بياناتك...</div>;

  return (
    <div dir="rtl" style={{width:"100%",height:"100dvh",background:COLORS.cream,fontFamily:"'Segoe UI',Tahoma,Geneva,Verdana,sans-serif",color:COLORS.textPrimary,display:"flex",flexDirection:"column",overflow:"hidden",paddingTop:"env(safe-area-inset-top)",boxSizing:"border-box"}}>
      <div style={{flex:1,overflowY:"auto",overflowX:"hidden",WebkitOverflowScrolling:"touch"}}>
        <div key={screen} style={{animation:"screenFadeIn .32s ease"}}>
          {screen==="home" && <HomeScreen transactions={transactions} monthTotals={monthTotals} categories={categories} categoryTotals={categoryTotals} presets={presets} setScreen={setScreen} onQuickAdd={(p)=>{ setPendingPreset(p); setScreen("add"); }} username={session.user.user_metadata?.username} monthlyBudget={monthlyBudget} onUpdateTransaction={updateTransaction} onDeleteTransaction={deleteTransaction} />}
          {screen==="add" && <AddScreen categories={categories} onAdd={addTransaction} setScreen={setScreen} presets={presets} onAddPreset={addPreset} onDeletePreset={deletePreset} pendingPreset={pendingPreset} clearPendingPreset={()=>setPendingPreset(null)} />}
          {screen==="reports" && <ReportsScreen categoryTotals={categoryTotals} monthTotals={monthTotals} />}
          {screen==="budget" && <BudgetScreen categories={categories} categoryTotals={categoryTotals} onSaveCategory={saveCategory} onDeleteCategory={deleteCategory} onAddCategory={addCategory} onReorderCategories={reorderCategories} monthlyBudget={monthlyBudget} onSaveMonthlyBudget={saveMonthlyBudget} />}
          {screen==="settings" && <SettingsScreen transactions={transactions} categories={categories} username={session.user.user_metadata?.username} onSignOut={signOut} />}
        </div>
      </div>
      <BottomNav screen={screen} setScreen={setScreen} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

  var __compiled = Babel.transform(
    document.getElementById("app-source").textContent,
    { presets: [["react", { runtime: "classic" }]] }

  eval(__compiled);

<script>
  document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
  document.addEventListener('gesturechange', function(e){ e.preventDefault(); });
  document.addEventListener('gestureend', function(e){ e.preventDefault(); });
  var lastTouchEnd = 0;
  document.addEventListener('touchend', function(e){
    var now = Date.now();
    if (now - lastTouchEnd <= 350) e.preventDefault();
    lastTouchEnd = now;
  }, { passive:false });
</script>

  return {
    amount: amountMatch ? amountMatch[1] : "",
    merchant: merchantMatch ? merchantMatch[1].trim() : "",
    amountRaw: amountMatch ? amountMatch[0] : null,
    merchantRaw: merchantMatch ? merchantMatch[1].trim() : null,
  };
}
const MERCHANT_HINTS = {
  "بقالة": ["كارفور","لولو","سلطان سنتر","سوبرماركت","بقالة"],
  "مواصلات": ["بنزين","تاكسي","أوبر","كريم","محطة"],
  "ترفيه": ["سينما","ترفيه"],
  "صحة": ["صيدلية","مستشفى","عيادة"],
  "تسوق": ["سنتر","مول","ازياء","ملابس"],
  "فواتير": ["اتصالات","عمانتل","أوريدو","كهرباء","مياه"],
};
function guessCategoryFromText(text, categories){
  if(!text) return null;
  for(const [catName, keywords] of Object.entries(MERCHANT_HINTS)){
    if(keywords.some(k=>text.includes(k)) && categories.some(c=>c.name===catName)) return catName;
  }
  return null;
}
function escapeHtml(str){ return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function highlightMessage(text, amountRaw, merchantRaw, markStyle){
  let escaped = escapeHtml(text);
  const wrap = s => `<mark style="${markStyle}">${s}</mark>`;
  if(merchantRaw){ const e=escapeHtml(merchantRaw); escaped = escaped.replace(e, wrap(e)); }
  if(amountRaw){ const e=escapeHtml(amountRaw); escaped = escaped.replace(e, wrap(e)); }
  return escaped;
}

function ReportsScreen({categoryTotals,monthTotals}){
  const total=monthTotals.expense||1;
  const palette=[COLORS.navy,COLORS.gold,"#3C6E4A","#8A5A3C","#6B6459","#B34537"];
  let cumulative=0;
  const arcs=categoryTotals.map((c,i)=>{ const pct=(c.total/total)*100; const arc={...c,pct,offset:cumulative,color:palette[i%palette.length]}; cumulative+=pct; return arc; });
  const circumference=2*Math.PI*15.5;
  return (
    <Screen>
      <TopBar title="التقارير" />
      <Card style={{marginBottom:16}}>
        <p style={{fontSize:13,fontWeight:700,margin:"0 0 12px"}}>توزيع المصاريف هذا الشهر</p>

          <>
            <div style={{display:"flex",justifyContent:"center",padding:"8px 0 16px"}}>
              <svg width="140" height="140" viewBox="0 0 36 36">
                <circle cx="18" cy="18" r="15.5" fill="none" stroke={COLORS.border} strokeWidth="4" />
                {arcs.map(a=>(
                  <circle key={a.name} cx="18" cy="18" r="15.5" fill="none" stroke={a.color} strokeWidth="4"
                    strokeDasharray={`${(a.pct/100)*circumference} ${circumference}`}
                    strokeDashoffset={-(a.offset/100)*circumference} strokeLinecap="round" transform="rotate(-90 18 18)" />
                ))}
              </svg>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {arcs.map(a=>(
                <div key={a.name} style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>

                </div>
              ))}
            </div>
          </>
        )}
      </Card>
    </Screen>
  );
}

function BudgetScreen({categories,categoryTotals,onSaveCategory,onDeleteCategory,onAddCategory}){
  const [editing,setEditing]=useState(null); const [newCatName,setNewCatName]=useState(""); const [newCatLimit,setNewCatLimit]=useState("");
  const totalLimit=categories.reduce((s,c)=>s+Number(c.limit_amount||0),0);
  const totalSpent=categoryTotals.reduce((s,c)=>s+c.total,0);
  const getSpent=name=>categoryTotals.find(c=>c.name===name)?.total||0;
  return (
    <Screen>
      <TopBar title="الميزانية الشهرية" />
      <Card style={{marginBottom:16}}>
        <p style={{fontSize:12,color:COLORS.textMuted,margin:0}}>إجمالي الميزانية</p>
        <p style={{fontSize:22,fontWeight:700,margin:"4px 0 8px",color:COLORS.navy,display:"flex",alignItems:"center",gap:5}}>{fmt(totalLimit)}<Riyal size={18}/></p>
        <div style={{height:8,background:COLORS.border,borderRadius:4,overflow:"hidden"}}><div style={{width:`${Math.min(100,(totalSpent/(totalLimit||1))*100)}%`,height:"100%",background:totalSpent>totalLimit?COLORS.danger:COLORS.gold}} /></div>
        <p style={{fontSize:11,color:COLORS.textSecondary,margin:"6px 0 0"}}>تم صرف {fmt(totalSpent)} من {fmt(totalLimit)}</p>
      </Card>
      <div style={{display:"flex",flexDirection:"column",gap:12,marginBottom:16}}>
        {categories.map(c=>{
          const spent=getSpent(c.name); const pct=Math.min(100,(spent/(c.limit_amount||1))*100); const over=spent>c.limit_amount; const isEditing=editing===c.id;
          return (
            <Card key={c.id}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                <div style={{display:"flex",alignItems:"center",gap:8}}><span style={{fontSize:20}}>{CATEGORY_ICONS[c.name]||"📦"}</span><span style={{fontSize:13,fontWeight:600}}>{c.name}</span></div>
                <button onClick={()=>setEditing(isEditing?null:c.id)} style={{background:"none",border:"none",fontSize:12,color:COLORS.textMuted,cursor:"pointer",fontFamily:"inherit"}}>{isEditing?"إغلاق":"تعديل"}</button>
              </div>
              <div style={{height:6,background:COLORS.border,borderRadius:3,overflow:"hidden"}}><div style={{width:`${pct}%`,height:"100%",background:over?COLORS.danger:COLORS.success}} /></div>
              <p style={{fontSize:11,color:over?COLORS.danger:COLORS.textSecondary,margin:"6px 0 0",display:"flex",alignItems:"center",gap:3,flexWrap:"wrap"}}>{fmt(spent)} / {fmt(c.limit_amount)}<Riyal size={10}/> {over?"— تجاوزت الميزانية":""}</p>
              {isEditing && (
                <div style={{marginTop:12,paddingTop:12,borderTop:`1px solid ${COLORS.border}`}}>
                  <input type="number" defaultValue={c.limit_amount} onBlur={e=>onSaveCategory(c.id,{limit_amount:parseFloat(e.target.value)||0})} style={{...inputStyle,marginBottom:8}} />
                  <button onClick={()=>{onDeleteCategory(c.id); setEditing(null);}} style={{...inputStyle,background:"#FBEAE7",color:COLORS.danger,border:"none",cursor:"pointer",textAlign:"center",fontWeight:700}}>حذف الفئة</button>
                </div>
              )}
            </Card>
          );
        })}
      </div>
      <Card>
        <p style={{fontSize:13,fontWeight:700,margin:"0 0 10px"}}>إضافة فئة جديدة</p>
        <input type="text" placeholder="اسم الفئة" value={newCatName} onChange={e=>setNewCatName(e.target.value)} style={{...inputStyle,marginBottom:8}} />
        <p style={{fontSize:12,color:COLORS.textSecondary,margin:"0 0 6px",display:"flex",alignItems:"center",gap:4}}>سقف الميزانية <Riyal size={11}/></p>
        <input type="number" placeholder="0.000" value={newCatLimit} onChange={e=>setNewCatLimit(e.target.value)} style={{...inputStyle,marginBottom:8}} />
        <button onClick={()=>{ if(!newCatName.trim()) return; onAddCategory({name:newCatName.trim(),limit_amount:parseFloat(newCatLimit)||0}); setNewCatName(""); setNewCatLimit(""); }} style={primaryBtnStyle}>إضافة الفئة</button>
      </Card>
    </Screen>
  );
}

function SettingsScreen({transactions,categories,userEmail,onSignOut}){
  const exportData=()=>{
    const blob=new Blob([JSON.stringify({transactions,categories},null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob); const a=document.createElement("a");
    a.href=url; a.download="بياناتي-المالية.json"; a.click(); URL.revokeObjectURL(url);
  };
  return (
    <Screen>
      <TopBar title="الإعدادات" />
      <Card style={{marginBottom:16}}>
        <div style={{display:"flex",alignItems:"center",gap:10,paddingBottom:12,borderBottom:`1px solid ${COLORS.border}`,marginBottom:12}}>
          <div style={{width:42,height:42,borderRadius:"50%",background:COLORS.navy,color:COLORS.goldLight,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:14}}>{userEmail?userEmail[0].toUpperCase():"?"}</div>
          <div><p style={{fontSize:14,fontWeight:700,margin:0}}>{userEmail}</p><p style={{fontSize:11,color:COLORS.textMuted,margin:0}}>حساب شخصي · Supabase</p></div>
        </div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0"}}><span style={{fontSize:13,color:COLORS.textSecondary}}>العملة</span><span style={{fontSize:12,color:COLORS.textMuted,display:"inline-flex",alignItems:"center",gap:4}}><Riyal size={12}/> ريال عماني</span></div>
        <div style={{display:"flex",justifyContent:"space-between",padding:"8px 0"}}><span style={{fontSize:13,color:COLORS.textSecondary}}>عدد الفئات</span><span style={{fontSize:12,color:COLORS.textMuted}}>{categories.length} فئة</span></div>
        <div style={{display:"flex",justifyContent:"space-between",padding:"8px 0"}}><span style={{fontSize:13,color:COLORS.textSecondary}}>عدد العمليات</span><span style={{fontSize:12,color:COLORS.textMuted}}>{transactions.length}</span></div>
      </Card>
      <button onClick={exportData} style={{...primaryBtnStyle,background:COLORS.card,color:COLORS.navy,border:`1px solid ${COLORS.border}`,marginBottom:10}}>تصدير بياناتي (JSON)</button>
      <button onClick={onSignOut} style={{...primaryBtnStyle,background:"#FBEAE7",color:COLORS.danger,border:"none"}}>تسجيل الخروج</button>
    </Screen>
  );
}

function App(){
  const [session,setSession]=useState(null);
  const [checkingSession,setCheckingSession]=useState(true);
  const [screen,setScreen]=useState("home");
  const [transactions,setTransactions]=useState([]);
  const [categories,setCategories]=useState([]);
  const [presets,setPresets]=useState([]);
  const [pendingPreset,setPendingPreset]=useState(null);
  const [dataLoaded,setDataLoaded]=useState(false);
  const [configError,setConfigError]=useState(false);

  useEffect(()=>{
    if(!isConfigured){
      setConfigError(true); setCheckingSession(false); return;
    }
    supabase.auth.getSession().then(({data})=>{ setSession(data.session); setCheckingSession(false); });
    const {data:listener}=supabase.auth.onAuthStateChange((_e,newSession)=>setSession(newSession));
    return ()=>listener.subscription.unsubscribe();
  },[]);

  const userId=session?.user?.id;

  useEffect(()=>{
    if(!userId) return;
    (async()=>{
      const {data:cats}=await supabase.from("categories").select("*").order("created_at");
      if(cats && cats.length>0){ setCategories(cats); }
      else {
        const seeded=DEFAULT_CATEGORIES.map(c=>({...c,user_id:userId}));
        const {data:inserted}=await supabase.from("categories").insert(seeded).select();
        setCategories(inserted||[]);
      }
      const {data:pre}=await supabase.from("presets").select("*").order("created_at");
      if(pre && pre.length>0){ setPresets(pre); }
      else {
        const seededPre=DEFAULT_PRESETS.map(p=>({...p,user_id:userId}));
        const {data:insertedPre}=await supabase.from("presets").insert(seededPre).select();
        setPresets(insertedPre||[]);
      }
      const {data:txs}=await supabase.from("transactions").select("*").order("date",{ascending:false});
      setTransactions(txs||[]); setDataLoaded(true);
    })();
  },[userId]);

  const addTransaction=useCallback(async t=>{
    const {data,error}=await supabase.from("transactions").insert({...t,user_id:userId}).select();
    if(!error && data) setTransactions(prev=>[data[0],...prev]);
  },[userId]);
  const saveCategory=useCallback(async(id,patch)=>{
    await supabase.from("categories").update(patch).eq("id",id);
    setCategories(prev=>prev.map(c=>c.id===id?{...c,...patch}:c));
  },[]);
  const deleteCategory=useCallback(async id=>{
    await supabase.from("categories").delete().eq("id",id);
    setCategories(prev=>prev.filter(c=>c.id!==id));
  },[]);
  const addCategory=useCallback(async c=>{
    const {data}=await supabase.from("categories").insert({...c,user_id:userId}).select();
    if(data) setCategories(prev=>[...prev,data[0]]);
  },[userId]);
  const addPreset=useCallback(async p=>{
    const {data}=await supabase.from("presets").insert({...p,user_id:userId}).select();
    if(data) setPresets(prev=>[...prev,data[0]]);
  },[userId]);
  const deletePreset=useCallback(async id=>{
    await supabase.from("presets").delete().eq("id",id);
    setPresets(prev=>prev.filter(p=>p.id!==id));
  },[]);
  const signOut=useCallback(async()=>{
    await supabase.auth.signOut(); setTransactions([]); setCategories([]); setDataLoaded(false); setScreen("home");
  },[]);

  const thisMonth=monthKey(todayStr());
  const monthTotals=useMemo(()=>transactions.filter(t=>monthKey(t.date)===thisMonth).reduce((acc,t)=>{ if(t.type==="income") acc.income+=Number(t.amount); else acc.expense+=Number(t.amount); return acc; },{income:0,expense:0}),[transactions,thisMonth]);
  const categoryTotals=useMemo(()=>{
    const map={};
    transactions.filter(t=>t.type==="expense" && monthKey(t.date)===thisMonth).forEach(t=>{ map[t.category]=(map[t.category]||0)+Number(t.amount); });
    return Object.entries(map).map(([name,total])=>({name,total})).sort((a,b)=>b.total-a.total);
  },[transactions,thisMonth]);

  if(configError){
    return (
      <div dir="rtl" style={{maxWidth:420,margin:"60px auto",padding:24,fontFamily:"sans-serif",background:"#FBEAE7",borderRadius:12,color:COLORS.danger}}>
        <b>لم يتم إعداد الاتصال بعد.</b><br/>افتح ملف HTML بمحرر نصوص وعبّي SUPABASE_URL و SUPABASE_ANON_KEY في أعلى الملف.
      </div>
    );
  }
  if(checkingSession) return <div style={{textAlign:"center",padding:60,color:COLORS.textMuted}}>جارِ التحقق من الجلسة...</div>;
  if(!session) return <AuthScreen />;
  if(!dataLoaded) return <div style={{textAlign:"center",padding:60,color:COLORS.textMuted}}>جارِ تحميل بياناتك...</div>;

  return (
    <div dir="rtl" style={{position:"fixed",inset:0,maxWidth:480,margin:"0 auto",background:COLORS.cream,fontFamily:"'Segoe UI',Tahoma,Geneva,Verdana,sans-serif",color:COLORS.textPrimary,display:"flex",flexDirection:"column",overflow:"hidden"}}>
      <div style={{flex:1,overflowY:"auto",overflowX:"hidden",WebkitOverflowScrolling:"touch"}}>
        {screen==="home" && <HomeScreen transactions={transactions} monthTotals={monthTotals} categories={categories} categoryTotals={categoryTotals} presets={presets} setScreen={setScreen} onQuickAdd={(p)=>{ setPendingPreset(p); setScreen("add"); }} />}
        {screen==="add" && <AddScreen categories={categories} onAdd={addTransaction} setScreen={setScreen} presets={presets} onAddPreset={addPreset} onDeletePreset={deletePreset} pendingPreset={pendingPreset} clearPendingPreset={()=>setPendingPreset(null)} />}
        {screen==="reports" && <ReportsScreen categoryTotals={categoryTotals} monthTotals={monthTotals} />}
        {screen==="budget" && <BudgetScreen categories={categories} categoryTotals={categoryTotals} onSaveCategory={saveCategory} onDeleteCategory={deleteCategory} onAddCategory={addCategory} />}
        {screen==="settings" && <SettingsScreen transactions={transactions} categories={categories} userEmail={session.user.email} onSignOut={signOut} />}
      </div>
      <BottomNav screen={screen} setScreen={setScreen} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

  var __compiled = Babel.transform(

  eval(__compiled);
</script>
</body>
